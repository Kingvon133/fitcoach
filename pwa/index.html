<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>FitCoach</title>
  <meta name="description" content="Dieta e allenamento con coach AI">
  <meta name="theme-color" content="#f7f7fa">

  <!-- PWA / iOS — tema chiaro fisso: status bar scura (testo/orologio leggibili su sfondo bianco) -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FitCoach">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="oggi" aria-label="Oggi">
      <span class="tab-icon" data-icon="grid"></span><span class="tab-label">Oggi</span>
    </button>
    <button class="tab" data-tab="dieta" aria-label="Dieta">
      <span class="tab-icon" data-icon="bowl"></span><span class="tab-label">Dieta</span>
    </button>
    <button class="tab" data-tab="workout" aria-label="Workout">
      <span class="tab-icon" data-icon="dumbbell"></span><span class="tab-label">Workout</span>
    </button>
    <button class="tab" data-tab="coach" aria-label="Coach">
      <span class="tab-icon" data-icon="sparkles"></span><span class="tab-label">Coach</span>
    </button>
    <button class="tab" data-tab="altro" aria-label="Altro">
      <span class="tab-icon" data-icon="gear"></span><span class="tab-label">Altro</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
    }
  </script>
</body>
</html>
